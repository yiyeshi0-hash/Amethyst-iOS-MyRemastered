name: intentprobe
on: [workflow_dispatch]
jobs:
  probe:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: select-xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: env
        run: |
          xcodebuild -version
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-path
          swiftc --version 2>&1 | head -2
      - name: install-xcodegen
        run: brew install xcodegen
      - name: build
        working-directory: intentprobe
        run: |
          xcodegen generate
          xcodebuild -project IntentProbe.xcodeproj -scheme IntentProbe -sdk iphoneos -configuration Debug CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | tail -8
      - name: evidence
        working-directory: intentprobe
        run: |
          echo "===== swift const-values flags ====="
          grep -o -- "-emit-const-values-path [^ ]*" build.log | head -5 || true
          grep -o -- "emit-const-values[^ ]*" build.log | head -5 || true
          echo "===== metadata processor invocation ====="
          grep -o "appintentsmetadataprocessor.*" build.log | head -3 || true
          echo "===== swiftconstvalues artifacts ====="
          find ~/Library/Developer/Xcode/DerivedData -name "*.swiftconstvalues" 2>/dev/null | head -5 || true
          for f in $(find ~/Library/Developer/Xcode/DerivedData -name "*.swiftconstvalues" 2>/dev/null | head -2); do echo "--- $f ---"; head -c 1200 "$f"; echo; done
          echo "===== extract.actionsdata ====="
          for f in $(find ~/Library/Developer/Xcode/DerivedData -name "extract.actionsdata" 2>/dev/null | head -2); do echo "--- $f ($(wc -c < $f) B) ---"; head -c 1500 "$f"; echo; done
          echo "===== nlu ====="
          find ~/Library/Developer/Xcode/DerivedData -path "*Metadata.appintents*" -type f 2>/dev/null | head -10 || true
          mkdir -p /tmp/meta
          for d in $(find ~/Library/Developer/Xcode/DerivedData -name "Metadata.appintents" -type d 2>/dev/null | head -2); do cp -R "$d" /tmp/meta/ 2>/dev/null || true; done
          cp build.log /tmp/meta/ 2>/dev/null || true
          ls -la /tmp/meta || true
      - uses: actions/upload-artifact@v4
        with:
          name: probe-meta
          path: /tmp/meta
