#
# Crowdin 配置 — Amethyst-iOS-Remastered
# 源语言：简体中文 (zh-CN)，目标语言：英语 / 繁体中文 / 日语 / 高棉语
# 源文件与翻译均位于 Natives/resources/<locale>.lproj/Localizable.strings，
# 其中 iOS 文件夹语言代码与 Crowdin 语言代码经 languages_mapping 以下映射对齐：
#   zh-CN (简体中文, 源) -> zh-Hans / zh-TW (繁体中文) -> zh-Hant / en / ja / km
#
project_id: "921973"

# 相对仓库根目录指向包含 .lproj 目录的位置
base_path: "/Natives/resources"

files:
  - source: "/zh-Hans.lproj/Localizable.strings"
    translation: "/%locale%.lproj/Localizable.strings"
    languages_mapping:
      locale:
        en: en
        zh-TW: zh-Hant
        ja: ja
        km: km